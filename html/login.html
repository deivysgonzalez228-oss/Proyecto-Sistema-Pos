<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abarrotes El Progreso - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0a4f5e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 350px;
            background-color: #083e4a;
            padding: 35px;
            border-radius: 8px;
            border: 1px solid #1e7185;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .shield { font-size: 60px; margin-bottom: 15px; }
        h2 { font-size: 20px; margin-bottom: 25px; font-weight: normal; }
        .input-group {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border-radius: 4px;
            margin-bottom: 15px;
            padding: 8px 12px;
        }
        .input-group input {
            width: 100%;
            border: none;
            background: transparent;
            color: #334155;
            font-size: 15px;
            outline: none;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <main class="login-card">
        <div class="shield">🛡️</div>
        <h2>Abarrotes El Progreso</h2>
        
        <form action="panel.html" method="GET">
            <div class="input-group">
                <span>👤 </span>
                <input type="text" value="admin" required>
            </div>
            <div class="input-group">
                <span>🔒 </span>
                <input type="password" value="Progreso2026" required>
            </div>
            <button type="submit" class="btn-login">Ingresar al Sistema</button>
        </form>
    </main>

</body>
</html>
